# Actions are pinned to full commit SHAs; Dependabot proposes the updates
# (keeping the "# vX.Y.Z" comments current) as pull requests against testing.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: testing
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "Update GitHub Actions"
