name: Temporary masked appearance fix

on:
  push:
    branches:
      - feat/plot-appearance-customization

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[masked-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/plot-appearance-customization
          fetch-depth: 0
      - name: Preserve masked-data semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/curvemole/gui/background_navigation.py')
          text = path.read_text(encoding='utf-8')
          old = '''        colour = colour_with_opacity(
              curve.colour,
              int(appearance["masked_opacity"]),
          )
          line_pen = pg.mkPen(
              colour,
              width=float(appearance["data_line_width"]),
              style=qt_pen_style(str(appearance["data_line_style"])),
          )
          symbol = marker_for_curve(appearance, index)

          if draw_lines:
              isolated_x: list[float] = []
              isolated_y: list[float] = []
              for run in _mask_display._true_runs(masked):
                  if run.size == 1:
                      point = int(run[0])
                      isolated_x.append(float(x[point]))
                      isolated_y.append(float(y[point]))
                      continue
                  item = workspace.plot.plot(x[run], y[run], pen=line_pen)
                  item._curvemole_masked_data = True
                  item.curve_id = curve.id
                  item.setZValue(4.0)
              if isolated_x and not draw_points:
                  item = workspace.plot.plot(
                      np.asarray(isolated_x, dtype=float),
                      np.asarray(isolated_y, dtype=float),
                      pen=None,
                      symbol=symbol,
                      symbolSize=float(appearance["masked_point_size"]),
                      symbolBrush=pg.mkBrush(colour),
                      symbolPen=None,
                  )
                  item._curvemole_masked_data = True
                  item.curve_id = curve.id
                  item.setZValue(4.0)

          if draw_points:
              item = workspace.plot.plot(
                  x[masked],
                  y[masked],
                  pen=None,
                  symbol=symbol,
                  symbolSize=float(appearance["masked_point_size"]),
                  symbolBrush=pg.mkBrush(colour),
                  symbolPen=None,
              )
              item._curvemole_masked_data = True
              item.curve_id = curve.id
              item.setZValue(4.0)
          '''
          new = '''        # Masked samples keep their established neutral-grey visual identity.
          # Size and opacity remain customizable, but spectrum colours never leak into masks.
          colour = colour_with_opacity(
              "#777777",
              int(appearance["masked_opacity"]),
          )
          line_pen = pg.mkPen(
              colour,
              width=float(appearance["data_line_width"]),
              style=qt_pen_style(str(appearance["data_line_style"])),
          )
          symbol = marker_for_curve(appearance, index)
          isolated_x: list[float] = []
          isolated_y: list[float] = []

          if draw_lines:
              for run in _mask_display._true_runs(masked):
                  if run.size == 1:
                      point = int(run[0])
                      isolated_x.append(float(x[point]))
                      isolated_y.append(float(y[point]))
                      continue
                  item = workspace.plot.plot(x[run], y[run], pen=line_pen)
                  item._curvemole_masked_data = True
                  item.curve_id = curve.id
                  item.setZValue(4.0)

          # A single masked sample has no line segment, so it is always rendered
          # as a marker even when the experimental-data mode is Lines.
          if isolated_x and not draw_points:
              item = workspace.plot.plot(
                  np.asarray(isolated_x, dtype=float),
                  np.asarray(isolated_y, dtype=float),
                  pen=None,
                  symbol=symbol,
                  symbolSize=float(appearance["masked_point_size"]),
                  symbolBrush=pg.mkBrush(colour),
                  symbolPen=None,
              )
              item._curvemole_masked_data = True
              item.curve_id = curve.id
              item.setZValue(4.0)

          if draw_points:
              item = workspace.plot.plot(
                  x[masked],
                  y[masked],
                  pen=None,
                  symbol=symbol,
                  symbolSize=float(appearance["masked_point_size"]),
                  symbolBrush=pg.mkBrush(colour),
                  symbolPen=None,
              )
              item._curvemole_masked_data = True
              item.curve_id = curve.id
              item.setZValue(4.0)
          '''
          assert old in text
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate
        run: python -m compileall -q src tests
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/curvemole/gui/background_navigation.py
          git commit -m "Preserve masked data appearance with plot customization [masked-fix] [skip release]"
          git push origin HEAD:feat/plot-appearance-customization
