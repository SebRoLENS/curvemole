name: Refresh website screenshots

# Kept as a manual entry point; rendering belongs to the gated Pages workflow.
on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  request:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Request complete website snapshot after readiness checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run website.yml --repo "$GITHUB_REPOSITORY" --ref main
