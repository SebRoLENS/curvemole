name: Publish CurveMole website

on:
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true
      news_only:
        type: boolean
        default: false
      website_only:
        type: boolean
        default: false
  workflow_run:
    workflows: [CI, Automatic release]
    types: [completed]
    # Promotions run Automatic release from testing; only main pushes deploy otherwise.
    branches: [main, testing]
  workflow_dispatch:
    inputs:
      mode:
        description: Publication validation mode
        type: choice
        options: [standalone, integrated]
        default: standalone

permissions:
  contents: read
  actions: read

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  PAGES_ARTIFACT: github-pages-${{ github.run_attempt }}

jobs:
  release-news:
    # Published betas have already passed the app matrix. Website-only runs
    # validate site tooling on Linux and use the verified stable app.
    if: inputs.news_only && github.ref == 'refs/heads/testing' && inputs.source_ref == github.sha
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
      - name: Assemble published news over the stable website
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/website_news.py --output "$RUNNER_TEMP/curvemole-website-news" --refresh-quick-start
      - name: Prepare the stable quick-start app and renderer
        id: quickstart
        run: >-
          python .github/scripts/quick_start_publication.py prepare
          --snapshot "$RUNNER_TEMP/curvemole-website-news"
          --checkout "$RUNNER_TEMP/curvemole-stable-tutorial"
      - name: Install stable tutorial GUI libraries
        if: inputs.website_only || steps.quickstart.outputs.required == 'true'
        run: bash .github/scripts/install_ubuntu_packages.sh fonts-dejavu-core libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        if: inputs.website_only || steps.quickstart.outputs.required == 'true'
        with:
          enable-cache: false
          python-version: '3.12'
      - name: Validate website tooling
        if: inputs.website_only
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          uv sync --locked --no-default-groups --group test
          uv run --no-sync pytest -q tests/test_website_publication.py tests/test_quick_start_publication.py tests/test_quick_start_data.py tests/test_release_news.py
      - name: Refresh the tutorial from the verified stable app
        if: steps.quickstart.outputs.required == 'true'
        env:
          STABLE_TUTORIAL: ${{ steps.quickstart.outputs.checkout }}
        run: |
          uv sync --project "$STABLE_TUTORIAL" --locked --no-default-groups --group screenshots
          uv run --project "$STABLE_TUTORIAL" --no-sync python .github/scripts/quick_start_publication.py refresh --snapshot "$RUNNER_TEMP/curvemole-website-news" --checkout "$STABLE_TUTORIAL" --renderer "$GITHUB_WORKSPACE/website/scripts/render_quick_start_screenshots.py"
          uv run --project "$STABLE_TUTORIAL" --no-sync python .github/scripts/refresh_website_showcase.py --snapshot "$RUNNER_TEMP/curvemole-website-news" --checkout "$STABLE_TUTORIAL"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        id: pages
        with:
          name: ${{ env.PAGES_ARTIFACT }}
          path: ${{ runner.temp }}/curvemole-website-news
      - name: Wait for the uploaded Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.pages.outputs.artifact_id }}
        run: bash .github/scripts/wait_for_pages_artifact.sh "$ARTIFACT_ID" "$PAGES_ARTIFACT"
      - name: Reject a superseded source
        run: |
          git fetch origin main testing
          python .github/scripts/website_news.py --check-current --output "$RUNNER_TEMP/curvemole-website-news"
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT }}

  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       (github.ref == 'refs/heads/main' ||
        (github.ref == 'refs/heads/testing' && inputs.mode == 'standalone'))) ||
      (github.ref == 'refs/heads/main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
        ((github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') ||
         (github.event.workflow_run.event == 'workflow_dispatch' &&
          github.event.workflow_run.path == '.github/workflows/automatic-release.yml' &&
          (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.head_branch == 'testing'))))
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          fetch-depth: 0
      - name: Check publication prerequisites
        id: readiness
        env:
          GH_TOKEN: ${{ github.token }}
          WEBSITE_PUBLICATION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'integrated' }}
        run: python .github/scripts/website_release.py
      - name: Install GUI libraries
        if: steps.readiness.outputs.ready == 'true'
        run: |
          bash .github/scripts/install_ubuntu_packages.sh fonts-dejavu-core libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        if: steps.readiness.outputs.ready == 'true'
        with:
          enable-cache: false
          python-version: '3.12'
      - name: Checkout updated publication tooling for stable recovery
        if: steps.readiness.outputs.ready == 'true' && github.ref == 'refs/heads/testing'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          path: publication-checks
          persist-credentials: false
      - name: Generate screenshots for this exact website snapshot
        if: steps.readiness.outputs.ready == 'true'
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
          PUBLICATION_TESTS: ${{ github.ref == 'refs/heads/testing' && 'publication-checks/tests/test_website_publication.py' || 'tests/test_website_publication.py' }}
          PUBLICATION_SOURCE: ${{ github.ref == 'refs/heads/testing' && 'publication-checks' || '.' }}
        run: |
          uv sync --locked --no-default-groups --group screenshots --group test
          uv run --no-sync pytest -q "$PUBLICATION_TESTS"
          uv run --no-sync python "$PUBLICATION_SOURCE/.github/scripts/refresh_website_showcase.py" --snapshot website/dist --checkout .
          flags=()
          if [[ "$PUBLICATION_SOURCE" == publication-checks ]]; then
            cp "$PUBLICATION_SOURCE/website/dist/quick-start.html" website/dist/quick-start.html
            flags+=(--renderer "$PUBLICATION_SOURCE/website/scripts/render_quick_start_screenshots.py")
          fi
          uv run --no-sync python "$PUBLICATION_SOURCE/.github/scripts/quick_start_publication.py" refresh --snapshot website/dist --checkout . "${flags[@]}"
      - name: Configure Pages
        if: steps.readiness.outputs.ready == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Upload complete website snapshot
        if: steps.readiness.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        id: pages
        with:
          name: ${{ env.PAGES_ARTIFACT }}
          path: website/dist
      - name: Wait for the uploaded Pages artifact
        if: steps.readiness.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.pages.outputs.artifact_id }}
          PUBLICATION_SOURCE: ${{ github.ref == 'refs/heads/testing' && 'publication-checks' || '.' }}
        run: bash "$PUBLICATION_SOURCE/.github/scripts/wait_for_pages_artifact.sh" "$ARTIFACT_ID" "$PAGES_ARTIFACT"
      - name: Reject a superseded snapshot
        if: steps.readiness.outputs.ready == 'true'
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: Deploy website
        if: steps.readiness.outputs.ready == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT }}
