name: Sync Zenodo DOI

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      version:
        description: Release version to synchronise
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: zenodo-discovery
  cancel-in-progress: false
  queue: max

jobs:
  discover:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      found: ${{ steps.discover.outputs.found }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - id: discover
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: python .github/scripts/doi_workflow.py discover --version "$REQUESTED_VERSION"
      - uses: actions/upload-artifact@v7
        if: steps.discover.outputs.found == 'true'
        with:
          name: discovered-dois
          path: discovered-dois.json
          retention-days: 1
          if-no-files-found: error

  apply:
    needs: discover
    if: needs.discover.outputs.found == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: curvemole-main-write
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/download-artifact@v7
        with:
          name: discovered-dois
      - name: Update only missing metadata and changed release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/doi_workflow.py apply
