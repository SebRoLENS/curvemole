name: Automatic release
run-name: ${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'testing' && 'Promote testing to stable' || 'Stable release' }}

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      bump:
        description: Stable increment on main (testing uses release-target.json)
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
      version:
        description: Optional exact version (testing must match release-target.json)
        required: false
        type: string

permissions:
  contents: write
  actions: write
  id-token: write
  attestations: write

concurrency:
  group: release-pipeline-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  promotion:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/testing'
    uses: ./.github/workflows/promote-testing.yml
    with:
      bump: ${{ inputs.bump || 'patch' }}
      version: ${{ inputs.version || '' }}

  plan:
    needs: promotion
    if: >-
      always() && !cancelled() &&
      (needs.promotion.result == 'success' ||
       (needs.promotion.result == 'skipped' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      active: ${{ steps.plan.outputs.active }}
      version: ${{ steps.plan.outputs.version }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      commit_sha: ${{ steps.plan.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
      - id: plan
        env:
          REQUESTED_BUMP: ${{ inputs.bump || '' }}
          REQUESTED_VERSION: ${{ inputs.version || '' }}
          TRIGGER_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python .github/scripts/release_state.py plan \
            --bump "$REQUESTED_BUMP" --version "$REQUESTED_VERSION" --message "$TRIGGER_MESSAGE"

  prepare:
    needs: plan
    if: needs.plan.outputs.active == 'true' && needs.plan.outputs.commit_sha == ''
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
      - name: Install document and GUI toolchain
        run: |
          bash .github/scripts/install_document_toolchain.sh \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
          python-version: "3.12"
      - run: uv sync --locked --no-default-groups --group screenshots
      - name: Prepare version, screenshots and manuals once
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          QT_QPA_PLATFORM: offscreen
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: |
          uv run --no-sync python .github/scripts/prepare_release.py --version "$VERSION"
          uv lock
          uv run --no-sync python scripts/generate_screenshots.py
          python scripts/build_manual.py
          python .github/scripts/release_state.py pack
      - uses: actions/upload-artifact@v7
        with:
          name: prepared-release
          path: prepared-release.tar.gz
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  commit:
    needs: [plan, prepare]
    if: always() && needs.plan.outputs.active == 'true' && (needs.plan.outputs.commit_sha != '' || needs.prepare.result == 'success')
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    concurrency:
      group: curvemole-main-write
      cancel-in-progress: false
      queue: max
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        if: needs.plan.outputs.commit_sha == ''
        with:
          name: prepared-release
      - id: commit
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: python .github/scripts/release_state.py commit --version "$VERSION"

  validate:
    needs: commit
    uses: ./.github/workflows/validate.yml
    with:
      source_ref: ${{ needs.commit.outputs.commit_sha }}

  draft:
    needs: [plan, commit, validate]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.commit.outputs.commit_sha }}
          fetch-depth: 0
      - name: Create or resume the same tag and draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: python .github/scripts/release_assets.py draft --tag "v$VERSION"

  packages:
    needs: [plan, draft]
    uses: ./.github/workflows/build-desktop.yml
    with:
      source_ref: v${{ needs.plan.outputs.version }}
    secrets: inherit

  doi:
    needs: [plan, packages]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Schedule DOI discovery after final publication
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: gh workflow run sync-zenodo-doi.yml --repo "$GITHUB_REPOSITORY" --ref main -f "version=$VERSION"

  sync-testing:
    needs: [commit, packages]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/testing'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.commit.outputs.commit_sha }}
          fetch-depth: 0
      - name: Bring the released version back to testing while preserving new work
        env:
          PROMOTION_SOURCE: ${{ needs.commit.outputs.commit_sha }}
        run: python .github/scripts/promote_testing.py sync
