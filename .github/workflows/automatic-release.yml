name: Automatic release

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "packaging/**"
      - "scripts/build_desktop.py"
      - "scripts/build_manual.py"
      - "docs/manual-preamble.tex"
      - ".github/workflows/build-desktop.yml"
      - ".github/workflows/automatic-release.yml"
      - ".github/scripts/prepare_release.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".release-trigger"
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to increment
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write
  actions: write

# Documentation also writes generated files to main. Use the same cross-workflow
# concurrency group so release metadata and manual rebuilds can never push at once.
concurrency:
  group: curvemole-main-write-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Administrative metadata updates carry [skip release] to preserve the current version.
  prepare-release:
    if: ${{ github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fonts-dejavu-core latexmk \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            pandoc texlive-xetex texlive-latex-extra texlive-fonts-recommended

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked --group dev

      - name: Prepare release metadata
        id: prepare
        env:
          # Always derive the requested bump from the event that triggered this run,
          # not from whatever administrative commit happens to be latest on main
          # when the queued job finally checks out the repository.
          REQUESTED_BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || contains(github.event.head_commit.message, '[major]') && 'major' || contains(github.event.head_commit.message, '[minor]') && 'minor' || 'patch' }}
        run: |
          args=()
          if [ -n "$REQUESTED_BUMP" ]; then args+=(--bump "$REQUESTED_BUMP"); fi
          VERSION="$(uv run python .github/scripts/prepare_release.py "${args[@]}")"
          uv lock
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Preparing CurveMole v$VERSION"

      # The generated manual embeds the package version, so it must be rebuilt
      # after prepare_release.py bumps the version and before the test suite
      # validates that generated documentation is in sync.
      - name: Build LaTeX and PDF manuals
        run: python scripts/build_manual.py

      - name: Validate release source
        env:
          QT_QPA_PLATFORM: offscreen
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: |
          uv run ruff check .
          uv run pytest
          uv build

      - name: Commit release metadata
        id: commit
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/curvemole/version.py pyproject.toml uv.lock README.md CITATION.cff \
            docs/manual.md docs/CurveMole_User_Manual.tex \
            docs/CurveMole_User_Manual.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Prepare v${VERSION} release"
            git push origin HEAD:main
          fi
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create annotated tag
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists."
            exit 1
          fi
          git tag -a "v${VERSION}" -m "CurveMole v${VERSION}"
          git push origin "v${VERSION}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          cat > /tmp/release-notes.md <<EOF
          ## CurveMole v${VERSION}

          Automated CurveMole release. Desktop packages are being built for Linux x86_64,
          Windows x86_64, macOS Apple Silicon, and macOS Intel. Python wheel and source
          packages will also be attached automatically.

          **Zenodo DOI:** pending archival or repository integration.
          EOF
          gh release create "v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "CurveMole v${VERSION}" \
            --notes-file /tmp/release-notes.md \
            --verify-tag

      # DOI archival is intentionally asynchronous. It is dispatched only after
      # the GitHub release exists, and failures do not block release/build jobs.
      - name: Dispatch Zenodo DOI sync
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          gh workflow run sync-zenodo-doi.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f "version=${VERSION}"

      - name: Dispatch and monitor desktop builds
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
          RELEASE_SHA: ${{ steps.commit.outputs.commit_sha }}
        run: |
          gh workflow run build-desktop.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f "source_ref=v${VERSION}"

          RUN_ID=""
          for attempt in $(seq 1 30); do
            RUN_ID="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/build-desktop.yml/runs?event=workflow_dispatch&head_sha=${RELEASE_SHA}&per_page=10" \
              --jq '.workflow_runs[0].id // empty')"
            if [ -n "$RUN_ID" ]; then break; fi
            sleep 4
          done
          if [ -z "$RUN_ID" ]; then
            echo "Could not locate the dispatched desktop-build run."
            exit 1
          fi
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status
