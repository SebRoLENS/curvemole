name: Validate source

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      run_tests:
        description: Run the source test matrix (false only for plugin-only pull requests)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked --only-group lint
      - run: uv run --no-sync ruff check .
      - name: Validate GitHub Actions syntax and expressions
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          uv run --no-sync python .github/scripts/lint_workflows.py "$RUNNER_TEMP/actionlint"
      - name: Audit workflow security
        # Low-confidence credential-persistence notes cover jobs that must push.
        run: uv run --no-sync zizmor --offline --min-severity medium --min-confidence medium .github/workflows .github/actions

  core:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    if: ${{ inputs.run_tests }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025, macos-15]
        python: ["3.12"]
        include:
          - os: ubuntu-22.04
            python: "3.13"
          - os: ubuntu-22.04
            python: "3.14"
    concurrency:
      group: source-tests-${{ github.ref }}-${{ matrix.os }}-${{ matrix.python }}-${{ inputs.source_ref != github.sha && inputs.source_ref || (github.event_name == 'workflow_dispatch' && github.run_id || '') }}
      # Read-only tests: prioritise the latest source, preserving isolated release validation.
      cancel-in-progress: true
      queue: single
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref }}
      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: bash .github/scripts/install_ubuntu_packages.sh libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --no-default-groups --group test
      - name: Tests
        # Linux coverage with the Python tracer and native desktop tests can exceed
        # eight minutes. Keep the full checks and allow bounded runner headroom.
        timeout-minutes: 12
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
          # CTracer can deadlock while tracing Qt callbacks and background saves.
          # Keep branch measurement using the Python tracer for this GUI suite.
          COVERAGE_CORE: pytrace
        run: |
          coverage=()
          if [[ "$RUNNER_OS" == Linux && "${{ matrix.python }}" == 3.12 ]]; then
            coverage+=(--cov=curvemole --cov-report=term-missing --cov-report=xml:coverage.xml)
          fi
          uv run --no-sync python scripts/run_ci_tests.py -q -o faulthandler_timeout=60 "${coverage[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Linux' && matrix.python == '3.12'
        with:
          name: source-coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14
