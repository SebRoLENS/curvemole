name: Compare startup with base revision

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/benchmark_startup.py'
      - '.github/workflows/startup-comparison.yml'

permissions:
  contents: read

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          path: candidate
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: '3.12'
      - run: uv sync --locked --no-default-groups --group test
        working-directory: candidate
      - name: Compare seven alternating fresh-process launches
        working-directory: candidate
        run: uv run --no-sync python scripts/benchmark_startup.py --baseline ../baseline --candidate . --output startup.json
      - uses: actions/upload-artifact@v7
        with:
          name: startup-${{ matrix.os }}
          path: candidate/startup.json
          if-no-files-found: error

  windows-upgrade:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          path: candidate
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: '3.12'
      - run: uv sync --locked --no-default-groups --group packaging
        working-directory: candidate
      - run: choco install innosetup --no-progress -y
      - name: Build old and new installers, upgrade in place and smoke-test
        shell: pwsh
        run: ./candidate/scripts/test_windows_installer_upgrade.ps1 -Baseline baseline -Candidate candidate -Python candidate/.venv/Scripts/python.exe
      - uses: actions/upload-artifact@v7
        with:
          name: windows-frozen-startup
          path: candidate/windows-startup.json
          if-no-files-found: error
