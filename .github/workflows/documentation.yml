name: Documentation

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      refresh_screenshots:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      refresh_screenshots:
        description: Refresh GUI screenshots before building the manual
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-manual:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Install document toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core latexmk pandoc poppler-utils \
            texlive-fonts-recommended texlive-latex-extra texlive-xetex
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        if: inputs.refresh_screenshots
        with:
          enable-cache: false
          python-version: "3.12"
      - name: Refresh GUI screenshots
        if: inputs.refresh_screenshots
        env:
          QT_QPA_PLATFORM: offscreen
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: |
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
          uv sync --locked --no-default-groups --group screenshots
          uv run --no-sync python scripts/generate_screenshots.py
      - name: Build and validate manual
        run: |
          python scripts/build_manual.py
          pdfinfo docs/CurveMole_User_Manual.pdf | grep -q '^Pages:'
          pdftotext docs/CurveMole_User_Manual.pdf - | grep -q 'Current manual version\|Updated for CurveMole'
          git diff --check
          tar -czf development-docs.tar.gz docs/CurveMole_User_Manual.tex docs/CurveMole_User_Manual.pdf docs/screenshots
      - uses: actions/upload-artifact@v7
        with:
          name: development-documentation
          path: development-docs.tar.gz
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  commit:
    needs: build-manual
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    concurrency:
      group: curvemole-main-write
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/download-artifact@v7
        with:
          name: development-documentation
      - name: Commit development editions only if source is still current
        run: |
          git fetch origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "Source superseded; keeping documentation as a test artifact only."
            exit 0
          fi
          tar -xzf development-docs.tar.gz
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CurveMole_User_Manual.tex docs/CurveMole_User_Manual.pdf docs/screenshots
          if ! git diff --cached --quiet; then
            git commit -m 'Update development documentation [skip release]'
            git push origin HEAD:main
          fi
