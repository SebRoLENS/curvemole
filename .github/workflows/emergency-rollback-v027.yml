name: Emergency rollback v0.27.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/emergency-rollback-v027.yml"

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Withdraw v0.27.0 and restore v0.26.7 as latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.27.0 --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          gh release edit v0.26.7 --repo "$GITHUB_REPOSITORY" --latest
