name: Validate background and spline UX patch

on:
  push:
    branches:
      - chatgpt/background-spline-ux-20260827
    paths:
      - .github/workflows/chatgpt-background-spline-patch.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/background-spline-ux-20260827
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply reviewed patch
        run: python .chatgpt/apply_background_spline_patch.py

      - name: Install uv and development environment
        run: |
          python -m pip install --upgrade pip uv
          uv sync --group dev

      - name: Ruff
        run: uv run ruff check .

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest

      - name: Remove temporary patch helpers
        if: success()
        run: |
          rm -f .chatgpt/apply_background_spline_patch.py
          rm -f .github/workflows/chatgpt-background-spline-patch.yml
          rmdir .chatgpt 2>/dev/null || true

      - name: Commit validated feature patch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add background subtraction and spline controls [skip release]"
          git push origin HEAD:chatgpt/background-spline-ux-20260827
