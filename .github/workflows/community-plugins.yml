name: Community plugins

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Community code never receives secrets or a writable repository token.
permissions:
  contents: read

jobs:
  validate:
    name: Validate plugins / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Preserve source line endings for cross-platform fingerprints
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: false
      - run: uv sync --locked --group dev
      - name: Manifest, registration, removal and functional tests
        env:
          QT_QPA_PLATFORM: offscreen
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: uv run python scripts/validate_community_plugins.py
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-check-${{ matrix.os }}
          path: build/community-catalog.json
          if-no-files-found: error
          retention-days: 14

  catalog:
    name: Validated community catalog
    needs: validate
    # PR artifacts are test reports only. The public install bundle is built
    # exclusively from main, after every supported platform passes.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: plugin-check-*
          path: reports
      - name: Verify platform agreement and package the tested sources
        shell: python
        run: |
          import hashlib, json, pathlib, shutil
          reports = sorted(pathlib.Path('reports').glob('*/community-catalog.json'))
          assert len(reports) == 3, 'Missing platform report'
          content = reports[0].read_bytes()
          assert all(p.read_bytes() == content for p in reports), 'Platform catalogs differ'
          destination = pathlib.Path('build/validated-community-plugins')
          destination.mkdir(parents=True)
          (destination / 'catalog.json').write_bytes(content)
          (destination / 'README.md').write_bytes(pathlib.Path('custom_plugins/README.md').read_bytes())
          for plugin in json.loads(content)['plugins']:
              folder = plugin['folder']
              assert pathlib.Path(folder).name == folder and folder not in ('.', '..')
              source = pathlib.Path('custom_plugins') / folder
              digest = hashlib.sha256()
              for path in sorted(source.rglob('*'), key=lambda item: item.relative_to(source).as_posix()):
                  assert not path.is_symlink()
                  if path.is_file():
                      digest.update(path.relative_to(source).as_posix().encode())
                      digest.update(b'\0')
                      digest.update(path.read_bytes())
              assert digest.hexdigest() == plugin['sha256'], 'Untested source change'
              shutil.copytree(source, destination / folder)
      - uses: actions/upload-artifact@v4
        with:
          name: validated-community-plugins
          path: build/validated-community-plugins
          if-no-files-found: error
          retention-days: 90

      - name: Create direct-download ZIP files
        shell: python
        run: |
          import hashlib, json, pathlib, shutil
          source = pathlib.Path('build/validated-community-plugins')
          output = pathlib.Path('build/plugin-downloads')
          output.mkdir(parents=True)
          shutil.make_archive(str(output / 'validated-community-plugins'), 'zip', source)
          for plugin in json.loads((source / 'catalog.json').read_text())['plugins']:
              folder = plugin['folder']
              shutil.make_archive(str(output / folder), 'zip', source, folder)
          shutil.copy2(source / 'catalog.json', output / 'catalog.json')
          (output / 'SHA256SUMS.txt').write_text(''.join(
              f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n'
              for path in sorted(output.glob('*.zip'))), encoding='utf-8')
      - uses: actions/upload-artifact@v4
        with:
          name: community-plugin-downloads
          path: build/plugin-downloads
          if-no-files-found: error
          retention-days: 90

  publish-downloads:
    name: Publish stable plugin downloads
    needs: catalog
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: community-plugin-downloads
      cancel-in-progress: false
    steps:
      # This privileged job never checks out, imports or executes plugin code.
      - uses: actions/download-artifact@v4
        with:
          name: community-plugin-downloads
          path: downloads
      - name: Publish ZIPs without replacing the latest application release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TESTED_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          current_main=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          if [ "$current_main" != "$TESTED_SHA" ]; then
            relevant_changes=$(gh api "repos/$GH_REPO/compare/$TESTED_SHA...$current_main" \
              --jq '[.files[].filename | select(startswith("custom_plugins/") or . == "scripts/validate_community_plugins.py" or . == ".github/workflows/community-plugins.yml")] | length')
            if [ "$relevant_changes" != "0" ]; then
              echo "Plugin sources or their validation pipeline changed; leave publication to a newer run."
              exit 0
            fi
            echo "Main advanced only in unrelated files; publishing the validated plugin sources."
          fi
          tag=community-plugins-latest
          cat > /tmp/plugin-release-notes.md <<EOF
          Download the complete bundle or an individual plugin ZIP below. No GitHub login is required.

          Extract the ZIP, then choose its plugin folder in CurveMole: File > Plugin manager > Choose plugin folder.

          Tested on Linux, Windows and macOS. Tested source: $TESTED_SHA.
          Validation: $RUN_URL
          This rolling plugin catalog is separate from the latest CurveMole application release.
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            gh api "repos/$GH_REPO/git/refs/tags/$tag" -X PATCH -f sha="$TESTED_SHA" -F force=true
            gh release upload "$tag" downloads/* --clobber
            gh release edit "$tag" --title "Community plugins — latest validated downloads" \
              --notes-file /tmp/plugin-release-notes.md --prerelease --latest=false
          else
            gh release create "$tag" downloads/* --target "$TESTED_SHA" \
              --title "Community plugins — latest validated downloads" \
              --notes-file /tmp/plugin-release-notes.md --prerelease --latest=false
          fi
