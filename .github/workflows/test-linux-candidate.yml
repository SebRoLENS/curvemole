name: Test Linux candidate

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: linux-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    name: Linux AppImage test artifact
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
          uv sync --locked --no-default-groups --group packaging

      - name: Build and smoke-test frozen application
        env:
          QT_QPA_PLATFORM: offscreen
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
          CURVEMOLE_PACKAGING_SMOKE: "1"
          CURVEMOLE_ICON: ${{ github.workspace }}/src/curvemole/resources/curvemole.png
        run: uv run --no-sync python scripts/build_desktop.py

      - name: Package diagnostic bundle and AppImage
        run: |
          set -euxo pipefail
          CANDIDATE="${GITHUB_SHA::7}"
          tar -C dist -czf "CurveMole-${CANDIDATE}-linux-x86_64-bundle.tar.gz" CurveMole

          bash scripts/build_appimage.sh src/curvemole/resources/curvemole.png "CurveMole-${CANDIDATE}-linux-x86_64.AppImage"
          sha256sum \
            "CurveMole-${CANDIDATE}-linux-x86_64.AppImage" \
            "CurveMole-${CANDIDATE}-linux-x86_64-bundle.tar.gz" \
            > SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: CurveMole-linux-test-${{ github.run_number }}
          path: |
            CurveMole-*-linux-x86_64.AppImage
            CurveMole-*-linux-x86_64-bundle.tar.gz
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
