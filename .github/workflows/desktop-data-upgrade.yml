name: Preserve projects and settings across desktop updates

on:
  pull_request:
    paths:
      - 'src/**'
      - 'packaging/**'
      - 'scripts/test_*upgrade*'
      - 'scripts/build_appimage.sh'
      - '.github/workflows/desktop-data-upgrade.yml'

permissions:
  contents: read

jobs:
  upgrade:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          path: candidate
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
      - name: Install Linux GUI and AppImage runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libfuse2
      - name: Install Windows packaging tool
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: '3.12'
      - run: uv sync --locked --no-default-groups --group packaging
        working-directory: candidate
      - name: Build, update and reopen existing project and settings
        shell: bash
        working-directory: candidate
        run: uv run --no-sync python scripts/test_desktop_data_upgrade.py --baseline ../baseline --candidate . --work "$RUNNER_TEMP/CurveMole data upgrade test"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: data-upgrade-${{ matrix.os }}
          path: candidate/desktop-data-upgrade.json
          if-no-files-found: error
