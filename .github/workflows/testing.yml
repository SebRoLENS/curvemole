name: Testing builds

on:
  push:
    branches: [testing]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a beta prerelease (never updates stable)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: testing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/testing'
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: plan
        run: python .github/scripts/beta_release.py plan

  validate:
    needs: plan
    uses: ./.github/workflows/validate.yml
    with:
      source_ref: ${{ github.sha }}

  packages:
    needs: [plan, validate]
    # Metadata/infrastructure changes still run source validation without
    # publishing an otherwise identical application build.
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip release]')
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-desktop.yml
    with:
      source_ref: ${{ github.sha }}
      beta_version: ${{ needs.plan.outputs.version }}
    secrets: inherit

  publish:
    needs: [plan, packages]
    # The bootstrap is an Actions download only: no release of any kind is created.
    if: >-
      (github.event_name == 'push' && !contains(github.event.head_commit.message, '[beta artifacts only]')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: beta-assets
          merge-multiple: true
      - name: Publish verified beta without changing stable or the website
        env:
          GH_TOKEN: ${{ github.token }}
          BETA_VERSION: ${{ needs.plan.outputs.version }}
        run: python .github/scripts/beta_release.py publish

  doi:
    needs: [plan, validate, publish]
    if: >-
      always() && needs.validate.result == 'success' &&
      (needs.publish.result == 'success' ||
       (github.event_name == 'push' && contains(github.event.head_commit.message, '[skip release]')))
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: zenodo-beta-releases
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v6
      - name: Link verified beta DOI without changing stable metadata
        env:
          GH_TOKEN: ${{ github.token }}
          BETA_VERSION: ${{ needs.publish.result == 'success' && needs.plan.outputs.version || '' }}
        run: python .github/scripts/beta_doi.py --version "$BETA_VERSION"
