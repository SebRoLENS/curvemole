name: Verify macOS app replacement

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upgrade:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          path: candidate
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: '3.12'
      - run: uv sync --locked --no-default-groups --group packaging
        working-directory: candidate
      - name: Replace old app from DMG and verify project and preferences
        working-directory: candidate
        run: uv run --no-sync python scripts/test_macos_app_upgrade.py --baseline ../baseline --candidate . --work "$RUNNER_TEMP/CurveMole upgrade test"
      - uses: actions/upload-artifact@v7
        with:
          name: app-upgrade-${{ matrix.os }}
          path: candidate/macos-upgrade.json
          if-no-files-found: error
