name: Temporary plot appearance integration

on:
  push:
    branches:
      - feat/plot-appearance-customization

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[appearance-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/plot-appearance-customization
          fetch-depth: 0
      - name: Fix temporary patch script
        run: python scripts/tmp_fix_plot_appearance_patch.py
      - name: Apply integration patch
        run: python scripts/tmp_apply_plot_appearance_patch.py
      - name: Fix generated plot indentation
        run: python scripts/tmp_fix_generated_plot.py
      - name: Validate syntax
        run: python -m compileall -q src tests scripts
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/curvemole/gui/plot.py src/curvemole/gui/main_window.py src/curvemole/gui/background_navigation.py docs/quick-start.md
          git commit -m "Integrate project-scoped plot appearance controls [appearance-patch] [skip release]"
          git push origin HEAD:feat/plot-appearance-customization
