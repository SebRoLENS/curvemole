name: Temporary plot appearance integration

on:
  push:
    branches:
      - feat/plot-appearance-customization

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[appearance-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/plot-appearance-customization
          fetch-depth: 0
      - name: Fix temporary patch script quoting
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/tmp_apply_plot_appearance_patch.py')
          text = path.read_text(encoding='utf-8')
          old = '            """Render excluded samples using the current project appearance settings."""\n'
          new = '            # Render excluded samples using the current project appearance settings.\n'
          assert old in text
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply integration patch
        run: python scripts/tmp_apply_plot_appearance_patch.py
      - name: Validate syntax
        run: python -m compileall -q src tests scripts
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/curvemole/gui/plot.py src/curvemole/gui/main_window.py src/curvemole/gui/background_navigation.py docs/quick-start.md
          git commit -m "Integrate project-scoped plot appearance controls [appearance-patch] [skip release]"
          git push origin HEAD:feat/plot-appearance-customization
