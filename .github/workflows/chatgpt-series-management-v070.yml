name: ChatGPT series management v0.7 integration

on:
  push:
    branches: [chatgpt/series-management-v070-integration]
    paths:
      - ".chatgpt/apply_series_management_patch.py"
      - ".chatgpt/fix_series_identity.py"
      - ".chatgpt/fix_manual_pdf_id.py"
      - ".github/workflows/chatgpt-series-management-v070.yml"

permissions:
  contents: write

jobs:
  patch-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[patched]') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/series-management-v070-integration
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fonts-dejavu-core latexmk \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            pandoc texlive-xetex texlive-latex-extra texlive-fonts-recommended

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked --group dev

      - name: Apply validated patch
        run: |
          uv run python .chatgpt/apply_series_management_patch.py
          uv run python .chatgpt/fix_series_identity.py
          uv run python .chatgpt/fix_manual_pdf_id.py

      - name: Rebuild manual
        run: python scripts/build_manual.py

      - name: Validate
        env:
          QT_QPA_PLATFORM: offscreen
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: |
          uv run ruff check .
          uv run pytest -q

      - name: Commit integrated patch and remove helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf .chatgpt
          rm -f .github/workflows/chatgpt-series-management-v070.yml
          git add -A
          git commit -m "Add flexible series management on v0.7 [patched] [skip release]"
          git push origin HEAD:chatgpt/series-management-v070-integration
