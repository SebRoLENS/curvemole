name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  queue: ${{ github.event_name == 'pull_request' && 'single' || 'max' }}

jobs:
  plan:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      release: ${{ steps.plan.outputs.release }}
      documentation: ${{ steps.plan.outputs.documentation }}
      screenshots: ${{ steps.plan.outputs.screenshots }}
      plugins: ${{ steps.plan.outputs.plugins }}
      candidate: ${{ steps.plan.outputs.candidate }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
      - id: plan
        run: python .github/scripts/workflow_plan.py

  validate:
    needs: plan
    if: needs.plan.outputs.release != 'true'
    uses: ./.github/workflows/validate.yml
    with:
      source_ref: ${{ github.sha }}

  release:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    permissions:
      contents: write
      actions: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/automatic-release.yml
    with:
      source_ref: ${{ github.sha }}
    secrets:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  documentation:
    needs: plan
    if: needs.plan.outputs.documentation == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/documentation.yml
    with:
      source_ref: ${{ github.sha }}
      refresh_screenshots: ${{ needs.plan.outputs.screenshots == 'true' }}

  plugins:
    needs: plan
    if: needs.plan.outputs.plugins == 'true' && needs.plan.outputs.release != 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/community-plugins.yml
    with:
      source_ref: ${{ github.sha }}

  candidate:
    needs: plan
    if: needs.plan.outputs.candidate == 'true'
    uses: ./.github/workflows/test-linux-candidate.yml
    with:
      source_ref: ${{ github.sha }}
