name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      release: ${{ steps.plan.outputs.release }}
      documentation: ${{ steps.plan.outputs.documentation }}
      screenshots: ${{ steps.plan.outputs.screenshots }}
      plugins: ${{ steps.plan.outputs.plugins }}
      candidate: ${{ steps.plan.outputs.candidate }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - id: plan
        run: python .github/scripts/workflow_plan.py

  validate:
    needs: plan
    if: needs.plan.outputs.release != 'true'
    uses: ./.github/workflows/validate.yml
    with:
      source_ref: ${{ github.sha }}

  release:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    permissions:
      contents: write
      actions: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/automatic-release.yml
    with:
      source_ref: ${{ github.sha }}
    secrets: inherit

  documentation:
    needs: plan
    if: needs.plan.outputs.documentation == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/documentation.yml
    with:
      source_ref: ${{ github.sha }}
      refresh_screenshots: ${{ needs.plan.outputs.screenshots == 'true' }}

  plugins:
    needs: plan
    if: needs.plan.outputs.plugins == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/community-plugins.yml
    with:
      source_ref: ${{ github.sha }}

  candidate:
    needs: plan
    if: needs.plan.outputs.candidate == 'true'
    uses: ./.github/workflows/test-linux-candidate.yml
    with:
      source_ref: ${{ github.sha }}
