name: Validate function/background/spline UX patch

on:
  push:
    branches:
      - chatgpt/function-background-spline-ux-20260827

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt/function-background-spline-ux-20260827
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Align current source with reviewed patch context
        run: |
          python - <<'PY'
          from pathlib import Path

          plot = Path('src/curvemole/gui/plot.py')
          text = plot.read_text(encoding='utf-8')
          old = (
              '                "Place spline background nodes: left-click adds a point, right-click removes the nearest point, "\n'
              '                "and a left double-click accepts the spline. Masked regions are allowed and the curve updates live. "\n'
          )
          normalized = (
              '                "Place spline background nodes: left-click adds a point, right-click removes the nearest point, "\n'
              '                "and a left double-click accepts the spline. The curve updates live. "\n'
          )
          if old not in text:
              raise SystemExit('Current spline instruction text not found')
          plot.write_text(text.replace(old, normalized, 1), encoding='utf-8')

          patcher = Path('.chatgpt/apply_function_background_patch.py')
          patch_text = patcher.read_text(encoding='utf-8')
          marker = '# Manual: explain component-level background semantics and spline navigation.\n'
          extra = '''replace_once(\n    "src/curvemole/gui/plot.py",\n    """    def _update_interaction_state(self) -> None:\n        interactive = self._placement_mode is not None\n        enabled = not interactive and not self._view_locked and not self.view_box.mask_mode\n        self.plot.setMouseEnabled(x=enabled, y=enabled)\n""",\n    """    def _update_interaction_state(self) -> None:\n        spline_navigation = self._placement_mode == \"spline\"\n        interactive = self._placement_mode is not None\n        enabled = (spline_navigation or not interactive) and not self._view_locked and not self.view_box.mask_mode\n        self.plot.setMouseEnabled(x=enabled, y=enabled)\n""",\n)\n\n'''
          if marker not in patch_text:
              raise SystemExit('Could not locate manual marker in patcher')
          patcher.write_text(patch_text.replace(marker, extra + marker, 1), encoding='utf-8')
          PY

      - name: Apply reviewed patch
        run: python .chatgpt/apply_function_background_patch.py

      - name: Install development environment
        run: uv sync --locked --group dev

      - name: Ruff
        run: uv run ruff check .

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: uv run pytest

      - name: Remove temporary patch helpers
        run: |
          rm -f .chatgpt/apply_function_background_patch.py
          rm -f .github/workflows/chatgpt-validate-function-background.yml
          rmdir .chatgpt 2>/dev/null || true

      - name: Commit validated feature patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Unify fitting functions and improve background/spline UX [skip release]'
          git push origin HEAD:chatgpt/function-background-spline-ux-20260827
