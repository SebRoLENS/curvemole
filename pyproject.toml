[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "curvemole"
version = "0.12.2"
description = "Modular Scientific Curve Fitting"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "GPL-3.0-or-later"}
authors = [
  {name = "Sebastiano Romi", email = "romi@lens.unifi.it"},
]
keywords = ["curve-fitting", "spectroscopy", "raman", "infrared", "powder-diffraction", "kinetics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "pandas>=2.1",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
  "platformdirs>=4.2",
  "PySide6>=6.7",
  "pyqtgraph>=0.13.7",
]

[project.urls]
Homepage = "https://github.com/SebRoLENS/curvemole"
Repository = "https://github.com/SebRoLENS/curvemole"
Issues = "https://github.com/SebRoLENS/curvemole/issues"

[project.scripts]
curvemole = "curvemole.cli:main"
curvemole-gui = "curvemole.gui.app:main"

[project.entry-points."curvemole.functions"]

[tool.hatch.build.targets.wheel]
packages = ["src/curvemole"]

[tool.hatch.build.targets.wheel.force-include]
"docs" = "curvemole/resources/docs"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/examples",
  "/README.md",
  "/LICENSE",
  "/CITATION.cff",
  "/CHANGELOG.md",
]

[tool.hatch.build]
include = [
  "src/curvemole/**/*.py",
  "src/curvemole/resources/*",
]

[dependency-groups]
dev = [
  "build>=1.2",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "pyinstaller>=6.10",
  "pillow>=10.4",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
source = ["curvemole"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
